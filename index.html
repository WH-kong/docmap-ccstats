<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docmap — 인터랙티브 상호참조 맵</title>
<style>
  :root { --sc:#2e7d32; --r0:#1565c0; --r1:#6a1b9a; --ux:#ef6c00; --miss:#c62828; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #app { display:flex; flex-direction:column; height:100vh; }
  #bar { padding:8px 12px; border-bottom:1px solid #e0e0e0; display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:13px; background:#fafafa; }
  #bar label { display:inline-flex; gap:4px; align-items:center; cursor:pointer; }
  #bar button { font:inherit; padding:4px 10px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; }
  #bar button:hover:not(:disabled) { background:#f0f0f0; }
  #bar button:disabled { opacity:.5; cursor:default; }
  #hint { color:#888; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #canvas { flex:1; position:relative; overflow:hidden; }
  svg { width:100%; height:100%; display:block; background:#fff; }
  .edge { stroke:#c4c4c4; stroke-width:1.2; }
  .node { cursor:pointer; }
  .node circle { stroke:#fff; stroke-width:1.5; }
  .node text { font-size:11px; fill:#222; pointer-events:none; }
  .type-sc circle { fill:var(--sc); }
  .type-r.p0 circle { fill:var(--r0); }
  .type-r.p1 circle { fill:var(--r1); }
  .type-ux circle { fill:var(--ux); }
  .missing circle { fill:var(--miss); }
  .dim { opacity:.1; }
  .hidden { display:none; }
  #tip { position:absolute; pointer-events:none; max-width:340px; background:#222; color:#fff; padding:6px 9px; border-radius:6px; font-size:12px; line-height:1.45; opacity:0; transition:opacity .1s; z-index:10; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <strong>전체 상호참조 맵</strong>
    <label><input type="checkbox" data-type="sc" checked><span class="dot" style="background:var(--sc)"></span>시나리오</label>
    <label><input type="checkbox" data-type="r" checked><span class="dot" style="background:var(--r0)"></span>기능</label>
    <label><input type="checkbox" data-type="ux" checked><span class="dot" style="background:var(--ux)"></span>UX</label>
    <button id="reset">초기화</button>
    <button id="focus" disabled>포커스: 켜기</button>
    <span id="hint">노드 클릭 = 관련 강조 · 더블클릭 = 관련만 보기 · 드래그 = 이동</span>
  </div>
  <div id="canvas">

    <div id="tip"></div>
  </div>
</div>

ity":null,"resolved":true},{"id":"UX-COM-007","label":"복수 도메인 권한 시 각 도메인 접근","full":"복수의 도메인(대학)에 대한 운영 관리 권한을 부여받은 계정은 해당 도메인 각각의 데이터에 접근할 수 있어야 한다. 접근 가능 도메인의 범위는 계정의 운영 관리 권한 설정에 따라 결정된다","type":"ux","priority":null,"resolved":true}],"edges":[{"source":"SC-01","target":"R-001"},{"source":"SC-03","target":"R-001"},{"source":"R-001","target":"UX-P01-001"},{"source":"R-001","target":"UX-P01-002"},{"source":"R-001","target":"UX-P01-003"},{"source":"R-001","target":"UX-P01-004"},{"source":"R-001","target":"UX-P01-005"},{"source":"R-001","target":"UX-P01-021"},{"source":"R-001","target":"UX-COM-001"},{"source":"R-001","target":"UX-COM-002"},{"source":"R-001","target":"UX-COM-004"},{"source":"R-001","target":"UX-COM-005"},{"source":"SC-02","target":"R-002"},{"source":"R-002","target":"UX-P01-006"},{"source":"R-002","target":"UX-P01-009"},{"source":"R-002","target":"UX-P01-010"},{"source":"R-002","target":"UX-P01-011"},{"source":"R-002","target":"UX-COM-003"},{"source":"SC-01","target":"R-003"},{"source":"SC-02","target":"R-003"},{"source":"R-003","target":"UX-P01-007"},{"source":"R-003","target":"UX-P01-008"},{"source":"SC-03","target":"R-004"},{"source":"SC-04","target":"R-004"},{"source":"R-004","target":"UX-P01-012"},{"source":"R-004","target":"UX-P01-013"},{"source":"R-004","target":"UX-P01-014"},{"source":"SC-05","target":"R-005"},{"source":"R-005","target":"UX-P01-015"},{"source":"R-005","target":"UX-P01-016"},{"source":"R-005","target":"UX-P01-017"},{"source":"R-005","target":"UX-P01-018"},{"source":"R-005","target":"UX-P01-019"},{"source":"R-005","target":"UX-P01-020"},{"source":"R-005","target":"UX-P01-022"},{"source":"R-005","target":"UX-P01-023"},{"source":"R-005","target":"UX-COM-006"},{"source":"R-005","target":"UX-COM-007"}]}/*DATA_END*/;

const W = () => canvas.clientWidth || 800;

const adj = new Map(DATA.nodes.map((n) => [n.id, new Set()]));
for (const e of DATA.edges) { adj.get(e.source) && adj.get(e.source).add(e.target); adj.get(e.target) && adj.get(e.target).add(e.source); }

const colX = { sc: 0.18, r: 0.5, ux: 0.82 };

});

let focusMode = false;

let lastTapT = 0;

function visibleTypes() {
  const t = {};
  document.querySelectorAll('#bar input[data-type]').forEach((c) => { t[c.dataset.type] = c.checked; });

}
function focusSet() {
  if (!selected) return null;
  const s = new Set([selected]);
  for (const x of (adj.get(selected) || [])) s.add(x);
  return s;
}
function inFocus(n) { if (!focusMode || !selected) return true; return focusSet().has(n.id); }

function simulate(a) {
  const vt = visibleTypes();
  const active = nodes.filter((n) => vt[n.type] && inFocus(n));
  for (let i = 0; i < active.length; i++) {
    for (let j = i + 1; j < active.length; j++) {

      let dx = p.x - q.x, dy = p.y - q.y; let d2 = dx * dx + dy * dy || 0.01; let d = Math.sqrt(d2);
      const rep = (2600 / d2) * a;
      const fx = (dx / d) * rep, fy = (dy / d) * rep;
      p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
    }
  }
  for (const e of DATA.edges) {
    const p = nodeById.get(e.source), q = nodeById.get(e.target);
    if (!p || !q || !vt[p.type] || !vt[q.type] || !inFocus(p) || !inFocus(q)) continue;
    let dx = q.x - p.x, dy = q.y - p.y; let d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const k = (d - 150) * 0.02 * a;
    const fx = (dx / d) * k, fy = (dy / d) * k;
    p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
  }
  for (const n of active) {
    n.vx += (colX[n.type] * W() - n.x) * 0.012 * a;
    n.vy += (H() / 2 - n.y) * 0.002 * a;
  }
  for (const n of active) {
    if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue; }
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += Math.max(-25, Math.min(25, n.vx));
    n.y += Math.max(-25, Math.min(25, n.vy));
    n.x = Math.max(40, Math.min(W() - 40, n.x));
    n.y = Math.max(28, Math.min(H() - 16, n.y));
  }
}

const elNode = new Map();
const elEdge = [];
function nodeClass(n) {
  let c = 'node type-' + n.type;
  if (n.type === 'r') c += ' ' + (n.priority === 'P1' ? 'p1' : 'p0');
  if (n.resolved === false) c += ' missing';
  return c;
}
function build() {
  for (const e of DATA.edges) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('class', 'edge');
    gEdges.appendChild(line);
    elEdge.push({ line, e });
  }
  for (const n of nodes) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', nodeClass(n));
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', n.type === 'r' ? 14 : 9);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', n.type === 'r' ? 18 : 13);
    t.setAttribute('y', 4);
    t.textContent = n.label;
    g.appendChild(c); g.appendChild(t);
    gNodes.appendChild(g);
    elNode.set(n.id, g);
    attach(g, n);
  }
}
function render() {
  const vt = visibleTypes();
  const hi = selected ? focusSet() : null;
  for (const { line, e } of elEdge) {
    const p = nodeById.get(e.source), q = nodeById.get(e.target);
    line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
    line.setAttribute('x2', q.x); line.setAttribute('y2', q.y);
    const vis = vt[p.type] && vt[q.type] && inFocus(p) && inFocus(q);
    line.classList.toggle('hidden', !vis);
    line.classList.toggle('dim', !!(hi && !(hi.has(p.id) && hi.has(q.id))));
  }
  for (const n of nodes) {
    const g = elNode.get(n.id);
    g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    g.classList.toggle('hidden', !(vt[n.type] && inFocus(n)));
    g.classList.toggle('dim', !!(hi && !hi.has(n.id)));
  }
}
function reheat() { alpha = Math.max(alpha, 0.7); if (!raf) raf = requestAnimationFrame(step); }
function step() { simulate(alpha); render(); alpha *= 0.94; if (alpha > 0.02) raf = requestAnimationFrame(step); else raf = null; }

function attach(g, n) {
  let down = null, moved = false;
  g.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; moved = false; n.fx = n.x; n.fy = n.y; g.setPointerCapture(ev.pointerId); });
  g.addEventListener('pointermove', (ev) => {
    if (!down) return;
    if (Math.abs(ev.clientX - down.x) + Math.abs(ev.clientY - down.y) > 4) moved = true;
    const r = canvas.getBoundingClientRect();
    n.fx = ev.clientX - r.left; n.fy = ev.clientY - r.top; reheat();
  });
  g.addEventListener('pointerup', () => { n.fx = null; n.fy = null; down = null; if (!moved) handleTap(n); reheat(); });
  g.addEventListener('pointerenter', (ev) => showTip(ev, n));
  g.addEventListener('mousemove', (ev) => moveTip(ev));
  g.addEventListener('pointerleave', hideTip);
}
function handleTap(n) {
  const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  if (lastTapId === n.id && now - lastTapT < 300) {
    lastTapId = null; lastTapT = 0;
    selected = n.id; focusMode = true; syncFocusBtn(); reheat(); render();
  } else {
    lastTapId = n.id; lastTapT = now;
    onClick(n);
  }
}
function onClick(n) { selected = (selected === n.id) ? null : n.id; if (!selected) focusMode = false; syncFocusBtn(); render(); }
function syncFocusBtn() { focusBtn.disabled = !selected; focusBtn.textContent = '포커스: ' + (focusMode ? '끄기' : '켜기'); }
function showTip(ev, n) { tip.textContent = n.id + ' — ' + (n.full || n.label); tip.style.opacity = '1'; moveTip(ev); }
function moveTip(ev) { const r = canvas.getBoundingClientRect(); tip.style.left = (ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top + 12) + 'px'; }
function hideTip() { tip.style.opacity = '0'; }

document.getElementById('reset').addEventListener('click', () => { selected = null; focusMode = false; syncFocusBtn(); reheat(); render(); });
focusBtn.addEventListener('click', () => { if (!selected) return; focusMode = !focusMode; syncFocusBtn(); reheat(); render(); });
document.querySelectorAll('#bar input[data-type]').forEach((c) => c.addEventListener('change', () => { reheat(); render(); }));
document.getElementById('svg').addEventListener('pointerdown', (ev) => { if (ev.target.id === 'svg' || ev.target.id === 'viewport') { selected = null; focusMode = false; syncFocusBtn(); reheat(); render(); } });

build();
reheat();
</script>
</body>
