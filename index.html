const SOURCES = /*SRC_START*/{"r":"FRD — 비교과 강좌 운영 통계 체계 도입","sc":"LXCCUP-430 USD — 코스카탈로그 통계 고도화(강좌 통계)","ux":"URD — 비교과 강좌 운영 통계 체계 도입"}/*SRC_END*/;

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const tip = document.getElementById('tip');

const byId = new Map(DATA.nodes.map(function (n) { return [n.id, n]; }));
const adj = new Map(DATA.nodes.map(function (n) { return [n.id, new Set()]; }));
for (const e of DATA.edges) { if (adj.get(e.source)) adj.get(e.source).add(e.target); if (adj.get(e.target)) adj.get(e.target).add(e.source); }

let s = 1, tx = 0, ty = 0, gw = 0, gh = 0;
let root = null, seq = 0;
let nodeEl = new Map();

mermaid.initialize({ startOnLoad: false, theme: 'base', flowchart: { htmlLabels: true, curve: 'basis', nodeSpacing: 22, rankSpacing: 60 } });

function mmId(id) { return id.replace(/-/g, '_'); }
function mmLabel(v) { return String(v == null ? '' : v).replace(/"/g, "'"); }
function classOf(n) { return n.resolved === false ? 'miss' : (n.type === 'r' ? (n.priority === 'P1' ? 'r1' : 'r0') : n.type); }
const CLASSDEFS = [
  '  classDef sc fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20;',
  '  classDef r0 fill:#e3f2fd,stroke:#1565c0,color:#0d47a1;',
  '  classDef r1 fill:#f3e5f5,stroke:#6a1b9a,color:#4a148c;',
  '  classDef ux fill:#fff3e0,stroke:#ef6c00,color:#e65100;',
  '  classDef miss fill:#ffebee,stroke:#c62828,color:#b71c1c;'
];
function buildMmd(ids) {
  const set = new Set(ids);
  const lines = ['graph LR'];
  for (const n of DATA.nodes) { if (!set.has(n.id)) continue; lines.push('  ' + mmId(n.id) + '["' + mmLabel(n.id) + '<br/>' + mmLabel(n.label) + '"]:::' + classOf(n)); }
  for (const e of DATA.edges) { if (set.has(e.source) && set.has(e.target)) lines.push('  ' + mmId(e.source) + ' --> ' + mmId(e.target)); }
  return lines.concat(CLASSDEFS).join('\n');
}
function neighborhood(id) { const a = [id]; (adj.get(id) || new Set()).forEach(function (x) { a.push(x); }); return a; }

async function show(src) {
  stage.style.opacity = '0';
  const out = await mermaid.render('g' + (seq++), src);
  stage.innerHTML = out.svg;
  root = stage.querySelector('svg');
  const vb = root.viewBox && root.viewBox.baseVal;
  gw = (vb && vb.width) ? vb.width : root.getBBox().width;
  gh = (vb && vb.height) ? vb.height : root.getBBox().height;
  root.removeAttribute('width'); root.removeAttribute('height');
  root.style.width = gw + 'px'; root.style.height = gh + 'px'; root.style.maxWidth = 'none';
  wire();
  fit();
  stage.style.opacity = '1';
  const loading = document.getElementById('loading'); if (loading) loading.remove();
}

function wire() {
  nodeEl = new Map();
  function nodeDocId(el) {
    const txt = el.textContent || '';
    const m = txt.match(/(UX-[A-Z0-9]+-\d{3}|R-\d{3}|SC-\d{2})/);
    if (m && byId.has(m[1])) return m[1];
    const raw = el.id.replace(/^flowchart-/, '').replace(/-\d+$/, '').replace(/_/g, '-');
    return byId.has(raw) ? raw : null;
  }
  stage.querySelectorAll('.node').forEach(function (el) {
    const docId = nodeDocId(el);
    if (!docId) return;
    nodeEl.set(docId, el);
    el.addEventListener('dblclick', function (ev) { ev.stopPropagation(); show(buildMmd(neighborhood(docId))); });
    el.addEventListener('mouseenter', function (ev) { showTip(ev, docId); });
    el.addEventListener('mousemove', moveTip);
    el.addEventListener('mouseleave', hideTip);
  });
}

function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function srcOf(type) { return (SOURCES && SOURCES[type]) || ({ r: 'FRD', sc: 'USD', ux: 'URD' }[type]) || ''; }
function showTip(ev, id) {
  const n = byId.get(id);
  const main = id + ' — ' + (n && n.full ? n.full : id);
  const src = n ? srcOf(n.type) : '';
  tip.innerHTML = '<div>' + esc(main) + '</div>' + (src ? '<div class="tip-src">출처: ' + esc(src) + '</div>' : '');
  tip.style.opacity = '1';
  moveTip(ev);
}
function moveTip(ev) { const r = canvas.getBoundingClientRect(); tip.style.left = (ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top + 12) + 'px'; }
function hideTip() { tip.style.opacity = '0'; }

document.getElementById('reset').addEventListener('click', function () { show(MERMAID); });

function zoomApply() { if (!root) return; root.style.transformOrigin = '0 0'; root.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')'; }
function fit() {
  const cw = canvas.clientWidth || 800, ch = canvas.clientHeight || 600;
  const sc = Math.min(cw / (gw || cw), ch / (gh || ch)) * 0.95;
  s = (isFinite(sc) && sc > 0) ? Math.min(sc, 1.5) : 1;
  tx = Math.max(0, (cw - gw * s) / 2);
  ty = Math.max(0, (ch - gh * s) / 2);
  zoomApply();
}
document.getElementById('zin').addEventListener('click', function () { s = Math.min(4, s * 1.2); zoomApply(); });
document.getElementById('zout').addEventListener('click', function () { s = Math.max(0.2, s / 1.2); zoomApply(); });
document.getElementById('zfit').addEventListener('click', fit);
canvas.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const f = ev.deltaY < 0 ? 1.1 : (1 / 1.1);
  const ns = Math.max(0.2, Math.min(4, s * f));
  tx = mx - (mx - tx) * (ns / s); ty = my - (my - ty) * (ns / s); s = ns; zoomApply();
}, { passive: false });
let drag = null;
canvas.addEventListener('pointerdown', function (ev) {
  if (ev.target.closest && ev.target.closest('.node')) return;
  drag = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty };
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', function (ev) { if (!drag) return; tx = drag.tx + (ev.clientX - drag.x); ty = drag.ty + (ev.clientY - drag.y); zoomApply(); });
canvas.addEventListener('pointerup', function () { drag = null; });
canvas.addEventListener('dblclick', function (ev) { if (ev.target.closest && ev.target.closest('.node')) return; show(MERMAID); });

await show(MERMAID);
